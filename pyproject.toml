[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "auntysa-tts_jd217"
version = "0.1.0"
description = "解析时间标记，排列语音合成工程师·批处理调度与吞吐折中的发生顺序，标出间隔异常与逆序事件"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "auntysa" }]
keywords = ["llm", "cli", "analysis", "observability"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://auntysa.github.io"
Repository = "https://github.com/auntysa/tts_jd217"
Issues = "https://github.com/auntysa/tts_jd217/issues"

[project.scripts]
tts_jd217 = "tts_jd217:main"

[tool.setuptools]
py-modules = ["tts_jd217"]
